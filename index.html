<!DOCTYPE html>
<html>
<head>
  <title>CryptoScope AI</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: Arial;
      margin: 0;
    }
    header {
      padding: 40px;
      text-align: center;
    }
    .btn {
      padding: 10px 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      margin: 10px;
      cursor: pointer;
    }
    section {
      padding: 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td, th {
      padding: 10px;
      border-bottom: 1px solid #334155;
    }
  </style>
</head>
<body>

<header>
  <h1>CryptoScope AI</h1>
  <p>Track Top 100 Cryptocurrencies + Learn Finance with AI</p>
  <button class="btn">View Markets</button>
  <button class="btn">Ask AI</button>
</header>

<section>
  <h2>Live Market Preview</h2>
  <table>
    <tr>
      <th>Rank</th>
      <th>Coin</th>
      <th>Price</th>
      <th>24h Change</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Bitcoin</td>
      <td>$--</td>
      <td>--%</td>
    </tr>
  </table>
</section>

<section>
  <h2>Ask Our AI</h2>
  <input type="text" placeholder="Ask about crypto, inflation, DeFi..." style="width:70%; padding:10px;">
  <button class="btn">Ask</button>
</section>

<section>
  <h3>Disclaimer</h3>
  <p>This platform is for educational purposes only. Not financial advice.</p>
</section>

</body>
</html>
