<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game</title>
  <style>
    /* Reset some defaults */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    a.button {
      display: inline-block;
      background-color: #fff;
      color: #6e8efb;
      font-weight: bold;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Optional: login link hidden for now */
    .login-link {
      display: none; /* show if you implement login */
      color: #fff;
      text-decoration: underline;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Game</h1>
  <p>Pay monthly to get full access and enjoy the game.</p>

  <a class="button" href="https://payhip.com/order?link=SMGu2">
    Start Playing
  </a>

  <!-- Optional login link -->
  <!-- <p class="footer">Already paid? <a class="login-link" href="/login.html">Log in</a></p> -->

  <p class="footer">Secure subscription powered by Payhip</p>

</body>
</html>
